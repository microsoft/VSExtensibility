name: .NET

on:
  push:
    branches: [ "main", "phase-2-docs", "preview" ]
  pull_request:
    branches: [ "main", "phase-2-docs", "preview" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: setup-msbuild
      uses: microsoft/setup-msbuild@34cfbaee7f672c76950673338facd8a73f637506 # v1.1.3
#   - name: Setup dotnet
#     uses: actions/setup-dotnet@v3
#     with:
#       global-json-file: global.json
    - name: Restore dependencies
      run: msbuild /t:restore New_Extensibility_Model/Samples/Samples.sln
    - name: Build
      run: msbuild /t:build New_Extensibility_Model/Samples/Samples.sln
